[package]
name = "hermes-ssd-llm"
version = "0.2.0"
edition = "2021"
description = "Rust SSD-backed Hermes Agent launcher with local GGUF inference for Apple Silicon"
license = "MIT"
repository = "https://github.com/maxiguillermo1/hermes-ssd-llm"
keywords = ["hermes-agent", "llm", "apple-silicon", "inference", "ssd", "mmap"]
categories = ["science", "command-line-utilities"]
readme = "README.md"

[lib]
name = "hermes_ssd_llm"
path = "src/lib.rs"

[[bin]]
name = "hermes"
path = "src/bin/hermes.rs"

[[bin]]
name = "hermes-ssd-llm"
path = "src/bin/hermes_ssd_llm.rs"

[dependencies]
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
byteorder = "1.5"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
half = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
plist = "1"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
objc = "0.2"
block = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "inference_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
